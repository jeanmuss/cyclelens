name: Deploy retired public GitHub Pages shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-retired
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm --prefix app ci
      - name: Build the data-free public retirement shell
        run: npm --prefix app run build:public-retired
      - name: Verify the public artifact contains no product data
        shell: bash
        run: |
          test -d app/dist-public
          test -s app/dist-public/index.html
          test -s app/dist-public/404.html
          test -s app/dist-public/public-retired-release.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('app/dist-public/public-retired-release.json','utf8'));if(m.buildTarget!=='public-retired'||m.dataIncluded!==false||m.status!=='retired')process.exit(1)"
          find app/dist-public -type f -printf '%P\n' | sort > /tmp/cyclelens-public-files.txt
          printf '%s\n' 404.html index.html public-retired-release.json > /tmp/cyclelens-public-allowlist.txt
          diff -u /tmp/cyclelens-public-allowlist.txt /tmp/cyclelens-public-files.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist-public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
